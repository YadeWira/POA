# Every platform POA supports builds the poa command, runs the unit tests,
# the command line's checks and the round trip of every sample in
# tests/ogg, and records the SHA-256 of every sample's .poa
# (.github/test.sh); the last job checks they are the same bytes
# everywhere: the model is integer arithmetic only, so it must be.
name: CI

# Branches only: a tag's commit was already tested on its branch, and the
# Release workflow builds the tag. A newer push to the same branch cancels
# the run of the older one.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux-x64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Free Pascal
        run: sudo apt-get update && sudo apt-get install -y fpc
      - name: Test
        run: sh .github/test.sh
      - uses: actions/upload-artifact@v4
        with:
          name: hash-linux-x64
          path: hash.txt

  linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install Free Pascal
        run: sudo apt-get update && sudo apt-get install -y fpc
      - name: Test
        run: sh .github/test.sh
      - uses: actions/upload-artifact@v4
        with:
          name: hash-linux-arm64
          path: hash.txt

  linux-x86:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the 32-bit C library
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y libc6:i386 gcc-multilib
      - name: Install the 32-bit Free Pascal
        run: scripts/fpc-i386.sh /tmp/fpc-i386
      - name: Test
        env:
          FPC: /tmp/fpc-i386/fpc
        run: sh .github/test.sh
      - uses: actions/upload-artifact@v4
        with:
          name: hash-linux-x86
          path: hash.txt

  macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Free Pascal
        run: brew install fpc
      - name: Test
        run: sh .github/test.sh
      - uses: actions/upload-artifact@v4
        with:
          name: hash-macos-arm64
          path: hash.txt

  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Free Pascal (win32 and win64)
        shell: pwsh
        run: |
          $url = 'https://sourceforge.net/projects/freepascal/files/Win32/3.2.2/fpc-3.2.2.win32.and.win64.exe/download'
          curl.exe -L --fail --retry 3 -o "$env:TEMP\fpc-setup.exe" $url
          Start-Process -Wait -FilePath "$env:TEMP\fpc-setup.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-'
          $fpc = Get-ChildItem C:\FPC -Recurse -Filter fpc.exe | Select-Object -First 1
          if (-not $fpc) { throw 'fpc.exe not found after the installer' }
          Split-Path $fpc.FullName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding ascii
      - name: Test
        shell: bash
        env:
          FPC: fpc -Px86_64
        run: sh .github/test.sh
      - uses: actions/upload-artifact@v4
        with:
          name: hash-windows-x64
          path: hash.txt
      # the binaries, for testing in a Windows VM before a release
      - name: Collect the binaries
        shell: bash
        run: mkdir -p build/ci/bin && cp build/ci/poa.exe build/ci/bin/ && ls -la build/ci/bin
      - uses: actions/upload-artifact@v4
        with:
          name: bin-windows-x64
          path: build/ci/bin

  windows-x86:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Free Pascal (win32 and win64)
        shell: pwsh
        run: |
          $url = 'https://sourceforge.net/projects/freepascal/files/Win32/3.2.2/fpc-3.2.2.win32.and.win64.exe/download'
          curl.exe -L --fail --retry 3 -o "$env:TEMP\fpc-setup.exe" $url
          Start-Process -Wait -FilePath "$env:TEMP\fpc-setup.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-'
          $fpc = Get-ChildItem C:\FPC -Recurse -Filter fpc.exe | Select-Object -First 1
          if (-not $fpc) { throw 'fpc.exe not found after the installer' }
          Split-Path $fpc.FullName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding ascii
      - name: Test
        shell: bash
        env:
          FPC: fpc -Pi386
        run: sh .github/test.sh
      - uses: actions/upload-artifact@v4
        with:
          name: hash-windows-x86
          path: hash.txt
      # the binaries, for testing in a Windows VM before a release
      - name: Collect the binaries
        shell: bash
        run: mkdir -p build/ci/bin && cp build/ci/poa.exe build/ci/bin/ && ls -la build/ci/bin
      - uses: actions/upload-artifact@v4
        with:
          name: bin-windows-x86
          path: build/ci/bin

  determinism:
    needs: [linux-x64, linux-arm64, linux-x86, macos-arm64, windows-x64, windows-x86]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: hash-*
      - name: Compare the streams' hashes
        run: |
          for f in hash-*/*; do echo "$f: $(cat "$f" | tr '\n' ' ')"; done
          n=$(for f in hash-*/*; do tr -d '\r' < "$f" | cksum; done | sort -u | wc -l)
          if [ "$n" -ne 1 ]; then
            echo "the codec's streams differ between platforms" >&2
            exit 1
          fi
          echo "the same streams on every platform"
